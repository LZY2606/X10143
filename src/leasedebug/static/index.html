<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>租约调试台</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">租约调试台</div>
    <div class="exp-bar">
      <label>实验
        <select id="expSelect"></select>
      </label>
      <button id="btnNew" type="button">新建</button>
      <button id="btnFork" type="button">保存分叉</button>
      <button id="btnExport" type="button">导出</button>
      <label class="filebtn">导入
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="col col-timeline">
      <div class="card">
        <div class="card-title">模拟时间 <span id="clockNow" class="clock">0</span> ms
          <span class="muted">（单调虚拟时钟）</span>
        </div>
        <div class="transport">
          <button id="btnReset" type="button">⏮ 重置</button>
          <button id="btnStep" type="button">⏭ 单步</button>
          <button id="btnPlay" type="button">⏩ 快进</button>
          <button id="btnEnd" type="button">到结尾</button>
        </div>
        <input type="range" id="timelineRange" min="0" max="0" value="0" step="1">
        <div id="timeline" class="timeline"></div>
        <div class="legend">
          <span><i class="dot send"></i>发送</span>
          <span><i class="dot arrival"></i>到达</span>
          <span><i class="dot response"></i>响应</span>
          <span><i class="dot expire"></i>过期</span>
          <span><i class="dot partition"></i>分区</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">安排事件</div>
        <div class="form-grid">
          <label>客户端
            <select id="fClient"></select>
          </label>
          <label>发送时刻
            <input id="fSend" type="number" value="0" min="0">
          </label>
          <label>操作
            <select id="fOp">
              <option>acquire</option>
              <option>renew</option>
              <option>release</option>
              <option>read</option>
            </select>
          </label>
          <label>资源
            <input id="fResource" value="res/db">
          </label>
          <label>请求延迟
            <input id="fReqDelay" type="number" placeholder="默认">
          </label>
          <label>响应延迟
            <input id="fRespDelay" type="number" placeholder="默认">
          </label>
          <label>幂等键
            <input id="fIdem" placeholder="可选">
          </label>
          <label>fence
            <input id="fFence" type="number" placeholder="自动">
          </label>
        </div>
        <button id="btnAddRequest" type="button">添加请求</button>
        <hr>
        <div class="form-grid">
          <label>分区开始
            <input id="pStart" type="number" value="0" min="0">
          </label>
          <label>分区结束
            <input id="pEnd" type="number" value="0" min="0">
          </label>
          <label>分区客户端
            <select id="pClient"><option value="">全部客户端</option></select>
          </label>
        </div>
        <button id="btnAddPartition" type="button">制造网络分区</button>
      </div>

      <div class="card">
        <div class="card-title">客户端
          <button id="btnAddClient" class="small" type="button">+ 新建客户端</button>
        </div>
        <div id="clientList" class="client-list"></div>
      </div>
    </section>

    <section class="col col-state">
      <div class="card">
        <div class="card-title">服务端租约状态（服务端时间裁决）
          <span class="muted">TTL=<span id="ttlVal"></span>ms</span>
        </div>
        <div id="serverState" class="server-state"></div>
      </div>
      <div class="card">
        <div class="card-title">客户端视角
          <span class="muted">切换：</span>
          <select id="viewClient"></select>
          <span class="muted">墙上时间仅用于展示</span>
        </div>
        <div id="clientView" class="client-view"></div>
      </div>
      <div class="card">
        <div class="card-title">不变量面板</div>
        <div id="invariants" class="invariants"></div>
      </div>
    </section>

    <section class="col col-detail">
      <div class="card">
        <div class="card-title">最终摘要</div>
        <div id="summary" class="summary"></div>
      </div>
      <div class="card grow">
        <div class="card-title">请求时序（点击查看详情）</div>
        <div id="requestList" class="request-list"></div>
      </div>
      <div class="card">
        <div class="card-title">请求详情</div>
        <pre id="requestDetail" class="request-detail">点击左侧请求…</pre>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
